services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: attendease
      POSTGRES_USER: attendease
      POSTGRES_PASSWORD: attendease
    ports:
      - "5432:5432"
    volumes:
      - attendease_pg:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://attendease:attendease@db:5432/attendease
      JWT_SECRET: change-this-in-production
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  attendease_pg:
